<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control de Gastos</title>
  <meta name="description" content="Control de gastos personales: movimientos, tarjeta de crédito, presupuesto y categorías. Funciona sin conexión.">

  <meta name="theme-color" content="#F8FAFC">

  <!-- iOS: instalación desde Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Control de Gastos">
  <meta name="format-detection" content="telephone=no">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="saltar" href="#vista">Saltar al contenido</a>

  <div class="app-shell">
    <header class="topbar" id="topbar">
      <button type="button" class="icon-btn" id="btn-atras" aria-label="Atrás" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="topbar-titulo" id="titulo-vista">Control de Gastos</h1>
      <button type="button" class="icon-btn" id="btn-accion" aria-label="Agregar" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <main id="vista" class="vista" tabindex="-1"></main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Navegación principal">
      <a href="#/inicio" data-nav="inicio" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5M6.5 10v9h11v-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Inicio</span>
      </a>
      <a href="#/movimientos" data-nav="movimientos" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Movs.</span>
      </a>
      <a href="#/presupuesto" data-nav="presupuesto" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v9M9.2 10.2c0-1 1.2-1.7 2.8-1.7s2.8.7 2.8 1.7-1.2 1.6-2.8 1.6-2.8.6-2.8 1.6 1.2 1.7 2.8 1.7 2.8-.7 2.8-1.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Presupuesto</span>
      </a>
      <a href="#/categorias" data-nav="categorias" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h7l1.5 2H20v9.5H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 11h16" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>Categorías</span>
      </a>
      <a href="#/ajustes" data-nav="ajustes" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-1.9-3.3-2.3 1a7 7 0 0 0-2-1.2L14.4 3h-3.8l-.3 2.8a7 7 0 0 0-2 1.2l-2.3-1L4 9.3l2 1.5A7 7 0 0 0 5.9 12c0 .4 0 .8.1 1.2l-2 1.5 1.9 3.3 2.3-1a7 7 0 0 0 2 1.2l.3 2.8h3.8l.3-2.8a7 7 0 0 0 2-1.2l2.3 1 1.9-3.3-2-1.5c.1-.4.2-.8.2-1.2Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span>Ajustes</span>
      </a>
    </nav>
  </div>

  <div class="modal-fondo" id="modal-fondo" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" id="modal">
      <h2 class="modal-titulo" id="modal-titulo"></h2>
      <div class="modal-cuerpo" id="modal-cuerpo"></div>
      <div class="modal-acciones" id="modal-acciones"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p class="sin-js">Esta aplicación necesita JavaScript activado para funcionar.</p>
  </noscript>

  <script src="js/formato.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
